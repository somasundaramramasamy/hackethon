# Tests use an in-memory H2 database so they never touch the real MySQL data.
spring.datasource.url=jdbc:h2:mem:kavasam-test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Never call a real model from tests. This file replaces the main application.properties, so model keys
# from the environment or backend/.env are never read; tests that need a model use a fake one.
kavasam.llm.base-url=http://localhost:1/never-called
spring.jpa.open-in-view=false
