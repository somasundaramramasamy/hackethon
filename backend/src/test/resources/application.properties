# Tests use an in-memory H2 database so they never touch the real MySQL data.
spring.datasource.url=jdbc:h2:mem:kavasam-test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Never call a real model from tests, even if keys are set on the machine.
kavasam.llm.base-url=http://localhost:1/never-called
kavasam.llm.api-key=
kavasam.llm.judge-api-key=
