# Tests use an in-memory H2 database so they never touch the real MySQL data.
spring.datasource.url=jdbc:h2:mem:kavasam-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Never call the real Claude API from tests, even if ANTHROPIC_API_KEY is set on the machine.
spring.ai.anthropic.api-key=
spring.ai.google.genai.api-key=test-placeholder
# Two chat models are present; ChatClients are built in AiConfig.
spring.ai.chat.client.enabled=false
