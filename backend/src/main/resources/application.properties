spring.application.name=backend
server.port=8080

# ── Database: MySQL ──
# WARNING: this password is committed with the code. Move it to an environment variable
# (spring.datasource.password=${DB_PASSWORD}) before pushing to a public repository.
spring.datasource.url=jdbc:mysql://localhost:3306/cognizant?createDatabaseIfNotExist=true&tinyInt1isBit=false
spring.datasource.username=root
spring.datasource.password=Somu@0078
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tables are created and changed only by Flyway scripts in src/main/resources/db/migration.
# Hibernate just checks that the tables match the entities and never alters them.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Load simulated sample data, only when the tables are empty. Set to false for real data only.
kavasam.seed-sample-data=true
