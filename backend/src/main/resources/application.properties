spring.application.name=kavasam
server.port=8080

# Settings and keys from backend/.env (git-ignored), when the backend is started from backend/.
spring.config.import=optional:file:.env[.properties]

# ── Database: MySQL (or TiDB, which is MySQL-compatible) ──
# The address and login go in backend/.env (see backend/.env.example), never in this file.
# Without them the backend uses a local MySQL on 3306.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cognizant?createDatabaseIfNotExist=true&tinyInt1isBit=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hosted databases (e.g. TiDB Cloud) and laptop sleep close idle connections without warning.
# Recycle connections well before that and ping idle ones, so the pool never hands out a dead one.
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000

# Tables are created and changed only by Flyway scripts in src/main/resources/db/migration.
# Hibernate just checks that the tables match the entities and never alters them.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ── Models ──
# Any OpenAI-compatible endpoint works: OpenRouter by default, or your own server (vLLM, Ollama...).
# Keys come from the environment or backend/.env. Without a key the app starts and shows results,
# but cannot start runs.
kavasam.llm.base-url=${LLM_BASE_URL:https://openrouter.ai/api/v1}
kavasam.llm.api-key=${LLM_API_KEY:${OPENROUTER_API_KEY:}}
# Optional: a separate endpoint for the judge and agents, e.g. a self-hosted model.
kavasam.llm.judge-base-url=${JUDGE_BASE_URL:}
kavasam.llm.judge-api-key=${JUDGE_API_KEY:}
kavasam.llm.timeout-seconds=120
kavasam.llm.assistant-max-tokens=900
kavasam.llm.judge-max-tokens=4000
# Questions asked at the same time during a run.
kavasam.llm.concurrency=4
# Calls per minute to each endpoint (0 = no cap). New OpenRouter accounts get 20 a minute on some models,
# such as Claude, so the judge is kept just under that.
kavasam.llm.assistant-requests-per-minute=${ASSISTANT_REQUESTS_PER_MINUTE:0}
kavasam.llm.judge-requests-per-minute=${JUDGE_REQUESTS_PER_MINUTE:18}

# Assistant under test: open models an organization might host itself. The first is the default.
kavasam.llm.assistant-models[0].id=google/gemma-4-31b-it
kavasam.llm.assistant-models[0].label=Gemma 4 31B (Google, open)
kavasam.llm.assistant-models[0].note=The assistant in our measured runs; strong enough that language differences stand out
kavasam.llm.assistant-models[1].id=meta-llama/llama-3.2-3b-instruct
kavasam.llm.assistant-models[1].label=Llama 3.2 3B (Meta)
kavasam.llm.assistant-models[1].note=Small open model; failed repeatably in Tamil and Malayalam in our pilot
kavasam.llm.assistant-models[2].id=google/gemma-3-4b-it
kavasam.llm.assistant-models[2].label=Gemma 3 4B (Google)
kavasam.llm.assistant-models[2].note=Small open model; the base of Google's MedGemma 4B
kavasam.llm.assistant-models[3].id=meta-llama/llama-3.2-1b-instruct
kavasam.llm.assistant-models[3].label=Llama 3.2 1B (Meta)
kavasam.llm.assistant-models[3].note=Smallest option, for devices with little memory

# Judge (also runs the investigator and fix agents). The first is the default.
kavasam.llm.judge-models[0].id=anthropic/claude-sonnet-5.5
kavasam.llm.judge-models[0].label=Claude Sonnet 5.5 (Anthropic)
kavasam.llm.judge-models[0].note=Strong multilingual judge
kavasam.llm.judge-models[1].id=google/gemma-4-31b-it
kavasam.llm.judge-models[1].label=Gemma 4 31B (Google, open)
kavasam.llm.judge-models[1].note=Open model an organization can host itself, so no data leaves its servers

# ── App ──
# true for the public demo: browse recorded results; nothing can be changed and no model is called.
kavasam.read-only=${KAVASAM_READ_ONLY:false}
# Browser origins allowed to call the API (comma-separated).
kavasam.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Never send stack traces to clients (devtools turns them on locally).
server.error.include-stacktrace=never
