spring.application.name=backend
server.port=8080

# ── Database: MySQL ──
# WARNING: this password is committed with the code. Move it to an environment variable
# (spring.datasource.password=${DB_PASSWORD}) before pushing to a public repository.
spring.datasource.url=jdbc:mysql://localhost:3306/cognizant?createDatabaseIfNotExist=true&tinyInt1isBit=false
spring.datasource.username=root
spring.datasource.password=Somu@0078
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tables are created and changed only by Flyway scripts in src/main/resources/db/migration.
# Hibernate just checks that the tables match the entities and never alters them.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Load simulated sample data, only when the tables are empty. Set to false for real data only.
kavasam.seed-sample-data=true

# ── Spring AI ──
# API keys come from environment variables, or from backend/.env (git-ignored) when the backend
# is started from the backend/ folder. Keys are never stored in this file.
spring.config.import=optional:file:.env[.properties]

# Gemini: the sample health assistant under test. The Gemini client will not start with an
# empty key, so a placeholder is used when none is set; AiAvailability then returns 503.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:not-configured}
# Claude: the judge and the investigator agent
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}

# Two chat models are present, so each ChatClient is built in AiConfig instead of auto-configured.
spring.ai.chat.client.enabled=false

# Without a key the app still starts; the affected /api/ai endpoints answer 503.
# gemini-3.8-flash stalled for 10+ minutes on this key (Nov 2026); 3.5-flash answers in ~2s.
kavasam.ai.assistant-model=gemini-3.5-flash
kavasam.ai.judge-model=claude-opus-5-5
kavasam.ai.max-tokens=16000
# Claude effort per role: low | medium | high | xhigh | max
kavasam.ai.judge-effort=high
kavasam.ai.agent-effort=high
# A model call that takes longer than this fails with 502 instead of hanging.
kavasam.ai.timeout-seconds=120
# Requests per day the Gemini key allows (free tier: 20). The Scenarios page warns when a run needs more.
kavasam.ai.assistant-daily-limit=20
